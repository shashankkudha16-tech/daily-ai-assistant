spring:
  application:
    name: daily-ai-assistant
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dailyai}
    username: ${DB_USERNAME:dailyai}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Never baseline an existing schema: if flyway_schema_history is missing the run
    # must fail instead of stamping V1 and replaying V2+ over populated tables.
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

server:
  # Railway and other container hosts inject PORT; SERVER_PORT and 8080 keep local dev unchanged.
  port: ${PORT:${SERVER_PORT:8080}}
  # The TLS-terminating reverse proxy forwards X-Forwarded-*; framework mode makes the
  # request scheme, host and client address reflect the original request.
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:8h}
      cookie:
        name: DAILYAI_SESSION
        http-only: true
        # Set AUTH_COOKIE_SECURE=true and AUTH_COOKIE_SAME_SITE=none behind HTTPS
        # for a cross-site Capacitor/Android deployment.
        secure: ${AUTH_COOKIE_SECURE:false}
        same-site: ${AUTH_COOKIE_SAME_SITE:lax}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.dailyai.assistant: INFO
    com.dailyai.assistant.integration: DEBUG

app:
  timezone: Asia/Kolkata
  admin-api-key: ${ADMIN_API_KEY:}
  scheduler-api-key: ${SCHEDULER_API_KEY:}
  auth:
    registration-enabled: ${REGISTRATION_ENABLED:true}
    # Environment-only activation of the pre-authentication profile. Both values
    # must be set for the bootstrap to run; nothing is created or logged.
    bootstrap-email: ${BOOTSTRAP_EMAIL:}
    bootstrap-password: ${BOOTSTRAP_PASSWORD:}
    bootstrap-role: ${BOOTSTRAP_ROLE:USER}
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    login-window-minutes: ${LOGIN_WINDOW_MINUTES:15}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000,http://localhost,capacitor://localhost,https://localhost}
  rss:
    user-agent: "${RSS_USER_AGENT:DailyAiAssistant/1.0 (learning project; contact: student@example.com)}"
    connect-timeout-ms: 8000
    read-timeout-ms: 12000
    max-items-per-feed: 30
    fetch-on-startup: ${RSS_FETCH_ON_STARTUP:true}
    feeds:
      - name: OpenAI News
        url: https://openai.com/news/rss.xml
        category: generative-ai
      - name: Google DeepMind
        url: https://deepmind.google/blog/rss.xml
        category: ai-research
      - name: Google AI Blog
        url: https://blog.google/technology/ai/rss/
        category: machine-learning
      - name: Hugging Face Blog
        url: https://huggingface.co/blog/feed.xml
        category: ai-tools
      - name: TechCrunch AI
        url: https://techcrunch.com/category/artificial-intelligence/feed/
        category: latest-ai-news
      - name: arXiv cs.AI
        url: https://rss.arxiv.org/rss/cs.AI
        category: ai-research
  ai:
    enabled: ${AI_ENABLED:false}
    # Provider name is for telemetry only; the endpoint stays OpenAI-compatible.
    provider: ${AI_PROVIDER:groq}
    base-url: ${AI_BASE_URL:https://api.groq.com/openai/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:openai/gpt-oss-20b}
    timeout-ms: ${AI_TIMEOUT_MS:30000}
    # Transient failures (429/5xx/timeouts) are retried with bounded exponential backoff.
    max-attempts: ${AI_MAX_ATTEMPTS:2}
    retry-delay-ms: ${AI_RETRY_DELAY_MS:1000}
    # After this many consecutive failures the provider is skipped for the cooldown,
    # so article pages keep loading instantly while the provider is down.
    failure-threshold: ${AI_FAILURE_THRESHOLD:2}
    cooldown-ms: ${AI_COOLDOWN_MS:300000}
    # Hard cap on provider requests per local day. 0 disables the cap.
    max-calls-per-day: ${AI_MAX_CALLS_PER_DAY:100}
    # Do not retry an article whose AI attempt already failed inside this window.
    retry-after-minutes: ${AI_RETRY_AFTER_MINUTES:360}
