name: Daily RSS Update

on:
  schedule:
    - cron: '30 0 * * *' # 06:00 Asia/Kolkata (GitHub cron is UTC)
  workflow_dispatch:

concurrency:
  group: daily-rss-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      RAILWAY_BACKEND_URL: ${{ vars.RAILWAY_BACKEND_URL }}
      SCHEDULER_API_KEY: ${{ secrets.SCHEDULER_API_KEY }}

    steps:
      - name: Validate configuration
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_BACKEND_URL:-}" ]; then
            echo "::error::Set repository variable RAILWAY_BACKEND_URL to the public HTTPS URL of the Railway backend service (for example https://your-backend.up.railway.app)."
            exit 1
          fi
          if [[ ! "$RAILWAY_BACKEND_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "::error::RAILWAY_BACKEND_URL must be an HTTPS origin without a path or trailing slash."
            exit 1
          fi
          RAILWAY_BACKEND_URL="${RAILWAY_BACKEND_URL%/}"
          {
            echo "RAILWAY_BACKEND_URL=${RAILWAY_BACKEND_URL}"
            # 9 minutes of work, leaving headroom inside the 10 minute job timeout
            # so the summary step can still run when polling gives up.
            echo "DEADLINE_EPOCH=$(( $(date +%s) + 540 ))"
          } >> "$GITHUB_ENV"

      - name: Check Railway backend health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 "${RAILWAY_BACKEND_URL}/actuator/health" >/dev/null; then
              echo "Backend is healthy."
              exit 0
            fi
            if [ "$(date +%s)" -ge "${DEADLINE_EPOCH}" ]; then
              break
            fi
            echo "Waiting for backend to wake (attempt ${attempt}/30)..."
            sleep 10
          done
          echo "::error::Railway backend did not become healthy within the 5 minute wait window. Check the service URL and health check configuration."
          exit 1

      - name: Trigger RSS refresh
        id: trigger
        run: |
          set -euo pipefail
          if [ -z "${SCHEDULER_API_KEY:-}" ]; then
            echo "::error::Set repository secret SCHEDULER_API_KEY to the backend SCHEDULER_API_KEY value."
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_code="$(curl -sS -X POST \
            --max-time 60 \
            -H "X-Scheduler-Key: ${SCHEDULER_API_KEY}" \
            -o "$response_file" \
            -w "%{http_code}" \
            "${RAILWAY_BACKEND_URL}/api/scheduler/news/refresh")"

          if [ "$http_code" != "202" ]; then
            echo "::error::Trigger request returned HTTP ${http_code}."
            cat "$response_file" >&2 || true
            exit 1
          fi

          run_id="$(jq -r '.runId // empty' "$response_file")"
          status="$(jq -r '.status // "UNKNOWN"' "$response_file")"

          if [ -z "$run_id" ]; then
            echo "::error::Trigger response did not include a run ID."
            cat "$response_file" >&2 || true
            exit 1
          fi

          {
            echo "run_id=${run_id}"
            echo "status=${status}"
          } >> "$GITHUB_OUTPUT"
          echo "Triggered RSS refresh run ${run_id} (${status})."

      - name: Wait for RSS refresh completion
        id: poll
        run: |
          set -euo pipefail
          run_id="${{ steps.trigger.outputs.run_id }}"
          status_file="$(mktemp)"
          trap 'rm -f "$status_file"' EXIT

          while [ "$(date +%s)" -lt "${DEADLINE_EPOCH}" ]; do
            http_code="$(curl -sS \
              --max-time 15 \
              -H "X-Scheduler-Key: ${SCHEDULER_API_KEY}" \
              -o "$status_file" \
              -w "%{http_code}" \
              "${RAILWAY_BACKEND_URL}/api/scheduler/news/status")"

            if [ "$http_code" != "200" ]; then
              echo "::error::Status request returned HTTP ${http_code}."
              cat "$status_file" >&2 || true
              exit 1
            fi

            current_run_id="$(jq -r '.runId // empty' "$status_file")"
            status="$(jq -r '.status // "UNKNOWN"' "$status_file")"
            running="$(jq -r '.running // false' "$status_file")"
            saved="$(jq -r '.saved // 0' "$status_file")"
            duplicates="$(jq -r '.duplicates // 0' "$status_file")"
            items_read="$(jq -r '.itemsRead // 0' "$status_file")"
            failed_feeds="$(jq -r '.feedsFailed // 0' "$status_file")"

            if [ "$current_run_id" != "$run_id" ]; then
              echo "::error::Status endpoint now reports run '${current_run_id}', not the triggered run '${run_id}'."
              exit 1
            fi

            if [ "$status" = "FAILED" ]; then
              error_summary="$(jq -r '.errorSummary // "unknown error"' "$status_file")"
              echo "::error::RSS refresh run ${run_id} failed: ${error_summary}"
              exit 1
            fi

            if [ "$running" = "false" ] && [ "$status" = "SUCCEEDED" ]; then
              {
                echo "status=${status}"
                echo "saved=${saved}"
                echo "duplicates=${duplicates}"
                echo "items_read=${items_read}"
                echo "failed_feeds=${failed_feeds}"
              } >> "$GITHUB_OUTPUT"
              echo "RSS refresh run ${run_id} completed successfully."
              exit 0
            fi

            echo "RSS refresh run ${run_id} is ${status}; waiting..."
            sleep 10
          done

          echo "::error::RSS refresh run ${run_id} did not complete within the polling timeout."
          exit 1

      - name: Write job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Daily RSS Update"
            echo ""
            echo "| Result | Value |"
            echo "| --- | --- |"
            echo "| Triggered run ID | ${{ steps.trigger.outputs.run_id || 'not available' }} |"
            echo "| Final status | ${{ steps.poll.outputs.status || 'unknown' }} |"
            echo "| Articles saved | ${{ steps.poll.outputs.saved || '0' }} |"
            echo "| Duplicates skipped | ${{ steps.poll.outputs.duplicates || '0' }} |"
            echo "| Items read | ${{ steps.poll.outputs.items_read || '0' }} |"
            echo "| Failed feeds | ${{ steps.poll.outputs.failed_feeds || '0' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
